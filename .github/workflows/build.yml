name: Build Android 10 Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Android10-Music-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-android10-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android 10 source
        run: |
          test -f Android10-Music-Source.zip
          rm -rf Android10-Music-Source
          mkdir -p Android10-Music-Source
          unzip -q Android10-Music-Source.zip -d Android10-Music-Source

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p Android10-Music-Source assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android10-Music-APK
          path: Android10-Music-Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
