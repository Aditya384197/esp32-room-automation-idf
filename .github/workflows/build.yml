name: Build ESP32 Room Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup ESP-IDF and Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.2   # ✅ सही पैरामीटर और संस्करण
        target: esp32             # वैकल्पिक, पर स्पष्टता के लिए
        command: |
          idf.py build

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32-room-automation-firmware
        path: build/**/*.bin
        retention-days: 30
