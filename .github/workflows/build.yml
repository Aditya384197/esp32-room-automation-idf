name: Build ESP32 Room Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.2
        command: |
          idf.py set-target esp32
          idf.py build

    - name: Merge Firmware into Single Binary (Optional)
      run: |
        if [ -f build/esp32_room_automation.bin ]; then
          esptool.py --chip esp32 merge_bin \
            -o build/esp32_room_automation_merged.bin \
            --flash_mode dio \
            --flash_size 2MB \
            0x1000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp32_room_automation.bin
          echo "✅ Merged binary created"
        fi

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: room-automation-firmware
        path: |
          build/**/*.bin
          build/*_merged.bin
        retention-days: 30
