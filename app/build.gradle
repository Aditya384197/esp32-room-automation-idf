plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.music'
    compileSdk 35

    defaultConfig {
        applicationId 'com.android.music.portable'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '1.0-android10'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
